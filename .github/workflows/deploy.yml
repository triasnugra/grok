name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Cek Struktur Folder (Debug)
        run: |
          echo "=== DAFTAR SEMUA FOLDER HASIL BUILD ==="
          find . -maxdepth 2 -type d | grep -v "\.git" | grep -v "node_modules"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Kita uji coba .vercel/output/static sementara action mencari folder aslinya
          path: ./.vercel/output/static
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
